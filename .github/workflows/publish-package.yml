name: Publish capability package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name
        required: true
        type: string
      version:
        description: Semver version already merged to main
        required: true
        type: string
      source_commit:
        description: Full commit SHA containing this package version
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: capability-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release source and version tag
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9-]{1,63}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          tag="$PACKAGE-v$VERSION"
          [[ "$(git rev-parse "$tag^{commit}")" == "$SOURCE_COMMIT" ]]
          git show "$SOURCE_COMMIT:$PACKAGE/xiaoqi-capability.json" > "$RUNNER_TEMP/capability.json"
          python3 - "$RUNNER_TEMP/capability.json" "$PACKAGE" "$VERSION" <<'PY'
          import json, sys
          item=json.load(open(sys.argv[1]))
          assert item['id']==sys.argv[2] and item['version']==sys.argv[3]
          PY
          git worktree add --detach "$RUNNER_TEMP/source" "$SOURCE_COMMIT"
          python3 "$RUNNER_TEMP/source/scripts/validate_packages.py"
      - name: Test release package sources
        working-directory: ${{ runner.temp }}/source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tesseract-ocr tesseract-ocr-chi-sim fonts-noto-cjk
          /usr/bin/python3 -m unittest discover -s book-to-skill/tests -p 'test_*.py' -v
          /usr/bin/python3 -m unittest discover -s original-reading-annotations/tests -p 'test_*.py' -v
      - name: Build deterministic package and update catalog
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          cp "$GITHUB_WORKSPACE/catalog.json" "$RUNNER_TEMP/catalog.json"
          /usr/bin/python3 "$RUNNER_TEMP/source/scripts/publish_package.py" --root "$RUNNER_TEMP/source" --package "$PACKAGE" --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/$PACKAGE.zip" --catalog-path "$RUNNER_TEMP/catalog.json"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="$PACKAGE-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$PACKAGE.zip" --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/$PACKAGE.zip" "$RUNNER_TEMP/existing/$PACKAGE.zip"
          else
            gh release create "$tag" "$RUNNER_TEMP/$PACKAGE.zip" --title "$PACKAGE $VERSION" --notes "Source version published from reviewed main commit. See catalog.json for SHA-256 and host requirements."
          fi
      - name: Update catalog on main
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          git fetch origin main
          branch="catalog-update-$GITHUB_RUN_ID"
          git switch -C "$branch" origin/main
          /usr/bin/python3 "$RUNNER_TEMP/source/scripts/publish_package.py" --root "$RUNNER_TEMP/source" --package "$PACKAGE" --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/$PACKAGE.zip" --catalog-path "$GITHUB_WORKSPACE/catalog.json"
          /usr/bin/python3 scripts/validate_packages.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish capability catalog update"
            git push origin HEAD:main
          fi

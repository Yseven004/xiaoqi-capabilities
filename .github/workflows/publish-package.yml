name: Publish capability package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name
        required: true
        type: choice
        options: [study-notes-studio, book-to-skill, original-reading-annotations, learning-notes-manager]
      version:
        description: Semver version already merged to main
        required: true
        type: string
      source_commit:
        description: Full commit SHA containing this package version
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: capability-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release source and version tag
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          tag="$PACKAGE-v$VERSION"
          [[ "$(git rev-parse "$tag^{commit}")" == "$SOURCE_COMMIT" ]]
          git show "$SOURCE_COMMIT:$PACKAGE/xiaoqi-capability.json" > "$RUNNER_TEMP/capability.json"
          python3 - "$RUNNER_TEMP/capability.json" "$PACKAGE" "$VERSION" <<'PY'
          import json, sys
          item=json.load(open(sys.argv[1]))
          assert item['id']==sys.argv[2] and item['version']==sys.argv[3]
          PY
          git worktree add --detach "$RUNNER_TEMP/source" "$SOURCE_COMMIT"
          python3 scripts/validate_packages.py
      - name: Build deterministic package and update catalog
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 scripts/publish_package.py --root "$RUNNER_TEMP/source" --package "$PACKAGE" --source-commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/$PACKAGE.zip"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="$PACKAGE-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its immutable asset."
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/$PACKAGE.zip" --title "$PACKAGE $VERSION" --notes "Source version published from reviewed main commit. See catalog.json for SHA-256 and host requirements."
      - name: Update catalog on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="catalog-update-$GITHUB_RUN_ID"
          git switch -c "$branch"
          cp "$RUNNER_TEMP/source/catalog.json" catalog.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json
          git commit -m "Publish capability catalog update"
          git push origin HEAD:main
